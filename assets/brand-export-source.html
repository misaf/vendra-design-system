<!-- Source for social share images (assets/social) and app icons (assets/icons). Renders with brand tokens; export PNGs from here at 1x. -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;background:#888;display:flex;flex-wrap:wrap;gap:20px;padding:20px;align-items:flex-start}
.og{flex:none;width:1200px;height:630px;background:var(--petal-50);display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:100px;padding:0 70px 0 80px;box-sizing:border-box;align-items:center;font-family:var(--font-body);color:var(--ink-900)}
.og[dir="rtl"]{padding:0 80px 0 70px}
.og .copy{display:flex;flex-direction:column;gap:28px}
.og .eye{font-size:20px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--peony-600)}
.og[dir="rtl"] .eye{letter-spacing:0;font-size:24px}
.og h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:92px;line-height:1.02;letter-spacing:-.015em}
.og[dir="rtl"] h1{font-weight:600;font-size:76px;line-height:1.35;letter-spacing:0}
.og h1 em{color:var(--peony-500)}.og[dir="rtl"] h1 em{font-style:normal}
.og .sub{font-size:26px;color:var(--ink-500)}
.og .foot{border-top:1px solid var(--petal-300);padding-top:24px;margin-top:36px;font-size:22px;font-weight:500}
.og .frame{height:490px;border-radius:var(--radius-arch);background:var(--peony-100);display:grid;place-items:center}
.og .frame img{width:280px;height:280px}
.ic{background:var(--peony-500);display:grid;place-items:center;overflow:hidden}
.ic svg{width:72%;height:72%}
.ic.mask svg{width:52%;height:52%}
</style></head><body>
<div id="og-en" class="og" lang="en" dir="ltr"><div class="copy"><div class="eye">Vendra Florist · Karaj</div><h1>Soft flowers,<br><em>gathered by hand.</em></h1><div class="sub">Same-day delivery in Karaj · free handwritten card</div><div class="foot">vendra.ir</div></div><div class="frame"><img src="logo-stacked.png" alt=""></div></div>
<div id="og-fa" class="og" lang="fa" dir="rtl" data-lang="fa"><div class="copy"><div class="eye">گل‌فروشی وندرا · کرج</div><h1>گل‌های لطیف،<br><em>چیده با دست.</em></h1><div class="sub">ارسال همان‌روز در کرج · کارت دست‌نویس رایگان</div><div class="foot" dir="ltr" style="text-align:right">vendra.ir</div></div><div class="frame"><img src="logo-stacked-fa.png" alt=""></div></div>
<div id="icon-512" class="ic" style="width:512px;height:512px"><svg viewBox="70 76 80 80"><path d="M92,148 V106 a18,18 0 0 1 36,0 V148 Z" fill="none" stroke="#FFFFFF" stroke-width="3"></path><text x="110" y="138" text-anchor="middle" font-family="Instrument Serif" font-style="italic" font-size="38" fill="#FFFFFF">V</text></svg></div>
<div id="icon-maskable-512" class="ic mask" style="width:512px;height:512px"><svg viewBox="70 76 80 80"><path d="M92,148 V106 a18,18 0 0 1 36,0 V148 Z" fill="none" stroke="#FFFFFF" stroke-width="3"></path><text x="110" y="138" text-anchor="middle" font-family="Instrument Serif" font-style="italic" font-size="38" fill="#FFFFFF">V</text></svg></div>
<div id="icon-192" class="ic" style="width:192px;height:192px"><svg viewBox="70 76 80 80"><path d="M92,148 V106 a18,18 0 0 1 36,0 V148 Z" fill="none" stroke="#FFFFFF" stroke-width="3.5"></path><text x="110" y="138" text-anchor="middle" font-family="Instrument Serif" font-style="italic" font-size="38" fill="#FFFFFF">V</text></svg></div>
<div id="apple-touch-icon" class="ic" style="width:180px;height:180px"><svg viewBox="70 76 80 80"><path d="M92,148 V106 a18,18 0 0 1 36,0 V148 Z" fill="none" stroke="#FFFFFF" stroke-width="3.5"></path><text x="110" y="138" text-anchor="middle" font-family="Instrument Serif" font-style="italic" font-size="38" fill="#FFFFFF">V</text></svg></div>
<div id="favicon-32" class="ic" style="width:32px;height:32px;border-radius:6px"><svg viewBox="70 76 80 80" style="width:90%;height:90%"><path d="M92,148 V106 a18,18 0 0 1 36,0 V148 Z" fill="none" stroke="#FFFFFF" stroke-width="6"></path><text x="110" y="140" text-anchor="middle" font-family="Instrument Serif" font-style="italic" font-size="44" fill="#FFFFFF">V</text></svg></div>
<div id="favicon-16" class="ic" style="width:16px;height:16px;border-radius:3px"><svg viewBox="70 76 80 80" style="width:96%;height:96%"><path d="M92,148 V106 a18,18 0 0 1 36,0 V148 Z" fill="none" stroke="#FFFFFF" stroke-width="9"></path></svg></div>
</body></html>
