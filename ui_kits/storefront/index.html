<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FBF8F6"><title>Vendra Florist</title><meta name="description" content=""><link rel="stylesheet" href="../../styles.css"><link rel="icon" type="image/png" sizes="32x32" href="../../assets/icons/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="../../assets/icons/favicon-16.png"><link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest">
<script src="../../templates/_vendor/react.production.min.js"></script>
<script src="../../templates/_vendor/react-dom.production.min.js"></script>
<script src="../../templates/_vendor/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
</head><body><div id="root"></div>
<script type="text/babel" src="data.js.txt"></script><script type="text/babel" src="account-data.js.txt"></script><script type="text/babel" src="pages-data.js.txt"></script><script type="text/babel" src="filters-data.js.txt"></script><script type="text/babel" src="checkout-data.js.txt"></script><script type="text/babel" src="journal-data.js.txt"></script><script type="text/babel" src="extras-data.js.txt"></script><script type="text/babel" src="policies-data.js.txt"></script>
<script type="text/babel" src="tweaks-panel.jsx.txt"></script><script type="text/babel" src="Header.jsx.txt"></script><script type="text/babel" src="MobileNav.jsx.txt"></script><script type="text/babel" src="Footer.jsx.txt"></script><script type="text/babel" src="ProductGrid.jsx.txt"></script><script type="text/babel" src="Journal.jsx.txt"></script><script type="text/babel" src="Home.jsx.txt"></script><script type="text/babel" src="CategorySidebar.jsx.txt"></script><script type="text/babel" src="Shop.jsx.txt"></script><script type="text/babel" src="Product.jsx.txt"></script><script type="text/babel" src="Checkout.jsx.txt"></script><script type="text/babel" src="Bag.jsx.txt"></script><script type="text/babel" src="Reminders.jsx.txt"></script><script type="text/babel" src="Account.jsx.txt"></script><script type="text/babel" src="OrderDetail.jsx.txt"></script><script type="text/babel" src="Contact.jsx.txt"></script><script type="text/babel" src="Search.jsx.txt"></script><script type="text/babel" src="Weddings.jsx.txt"></script><script type="text/babel" src="Policy.jsx.txt"></script>
<script type="text/babel">
const NS=window.VendraDesignSystem_f4f210;const {Toast}=NS;
// Fallbacks only matter while an older _ds_bundle.js (without SkipLink/LiveRegion) is cached
const SkipLink=NS.SkipLink||(({href,children})=><a href={href} className="ag-skip">{children}</a>);
const LiveRegion=NS.LiveRegion||(({children})=><div role="status" aria-live="polite" aria-atomic="true" className="ag-sr-only">{children}</div>);
const TWEAK_DEFAULTS=/*EDITMODE-BEGIN*/{
  "currency": "toman",
  "apiBase": "",
  "payResult": "success",
  "shopResult": "success",
  "cardNumber": "6221061072645437",
  "holderEn": "Ehsan Mahmoodi",
  "holderFa": "احسان محمودی",
  "sheba": "",
  "journalSpeed": "normal",
  "tenant": "default"
}/*EDITMODE-END*/;
const PREVIEW=null;
const URL_TENANT=new URLSearchParams(location.search).get('tenant');
const ROUTES=['home','shop','product','bag','account','track','saved','weddings','contact','journal','post','policy'];
AG_SEO.register('weddings','policy');
// Kit state ↔ URL params (?lang&view&id&cat&post&m)
const stateToParams=({route,pid,postId,trackId,cat,policyId})=>{const s={view:route};if(route==='product')s.id=pid;if(route==='post')s.post=postId;if(route==='track'&&trackId)s.id=trackId;if(route==='shop'&&cat&&cat!=='all')s.cat=cat;if(route==='policy')s.id=policyId;return s;};
const paramsFor=(r,id)=>r==='shopcat'?{view:'shop',cat:id}:r==='post'?{view:r,post:id}:r==='shop'?{view:r}:{view:r,id};
function App(){
  const {mobile}=useBP();
  const [tw,setTweak]=useTweaks(TWEAK_DEFAULTS);AG_API.setBase(tw.apiBase);AG_DATA.setCurrency(tw.currency);AG_DATA.setPayCard(tw);AG_DATA.journalDelay=tw.journalSpeed==='slow'?3000:700;
  const saved=JSON.parse(localStorage.getItem('ag-kit')||'{}');
  const boot=React.useMemo(()=>{const q=new URLSearchParams(location.search);const fromUrl=q.has('view')||q.has('lang');const r=AG_SEO.readRoute(location.search);
    const acctL=saved.signedIn&&window.AG_ACCOUNT&&AG_ACCOUNT.locale();
    const b={lang:r.lang||acctL||saved.lang||'en',route:fromUrl?r.view:(saved.route||'home'),pid:AG_DATA.products.some(p=>p.id===saved.pid)?saved.pid:'lavender-whisper',postId:saved.postId||AG_DATA.posts[0].id,trackId:saved.trackId||'VN-10522',cat:'all',policyId:'shipping'};
    if(fromUrl){if(r.view==='product'){if(AG_DATA.products.some(p=>p.id===r.id))b.pid=r.id;else b.route='notfound';}if(r.view==='post')b.postId=r.post;if(r.view==='track')b.trackId=r.id||null;if(r.view==='shop'&&r.cat)b.cat=r.cat;if(r.view==='policy'){if(AG_DATA.policies[r.id])b.policyId=r.id;else b.route='notfound';}}
    return b;},[]);
  const [lang,setLang]=React.useState(boot.lang);// Light only — the storefront has no dark mode. 
  const theme='light';const setTheme=()=>{};
  const [route,setRoute]=React.useState(boot.route);const [pid,setPid]=React.useState(boot.pid);const [cat,setCat]=React.useState(boot.cat);const [trackId,setTrackId]=React.useState(boot.trackId);const [postId,setPostId]=React.useState(boot.postId);const [policyId,setPolicyId]=React.useState(boot.policyId);const [signedIn,setSignedIn]=React.useState(!!saved.signedIn);
  const [bag,setBag]=React.useState([{id:'ivory-rib-box',size:'generous',qty:1,unit:4100000}]);
  const [favs,setFavs]=React.useState(saved.favs||['pearl-orchid','crimson-hatbox']);const [searching,setSearching]=React.useState(false);const [toast,setToast]=React.useState(null);const [announce,setAnnounce]=React.useState('');
  const tenant=URL_TENANT||tw.tenant;
  React.useEffect(()=>{document.documentElement.lang=lang;document.documentElement.dataset.lang=lang;document.documentElement.dataset.theme=theme;if(tenant&&tenant!=='default')document.documentElement.dataset.tenant=tenant;else delete document.documentElement.dataset.tenant;document.documentElement.dir=lang==='fa'?'rtl':'ltr';document.querySelector('meta[name=theme-color]').content='#FBF8F6';if(!PREVIEW)localStorage.setItem('ag-kit',JSON.stringify({lang,route,pid,theme,trackId,signedIn,favs,postId}));},[lang,route,pid,theme,trackId,signedIn,favs,postId,tenant]);
  // Route object (from seo.readRoute) → state
  const apply=r=>{let v=r.view||'home';if(r.lang&&r.lang!==lang)setLang(r.lang);
    if(v==='shop')setCat(r.cat||'all');
    if(v==='product'){if(AG_DATA.products.some(p=>p.id===r.id))setPid(r.id);else v='notfound';}
    if(v==='post')setPostId(r.post);if(v==='track')setTrackId(r.id||null);
    if(v==='policy'){if(AG_DATA.policies[r.id])setPolicyId(r.id);else v='notfound';}
    setRoute(v);};
  const pushNext=React.useRef(false);
  const navigate=r=>{pushNext.current=true;apply(r);setSearching(false);window.scrollTo(0,0);};
  const go=(r,id)=>navigate(paramsFor(r,id));
  AG_NAV.href=(r,id)=>AG_SEO.routeParams({lang,...paramsFor(r,id)});
  AG_NAV.link=AG_SEO.linkHandler(navigate);AG_NAV.routes=ROUTES;
  const cur={route,pid,postId,trackId,cat,policyId};
  // State → URL: pushState for screen changes, replaceState for language / in-page filters; popstate for back/forward
  React.useEffect(()=>{const s=AG_SEO.routeParams({lang,...stateToParams(cur)});if(s!==location.search){history[pushNext.current?'pushState':'replaceState'](null,'',s);}pushNext.current=false;},[lang,route,pid,postId,trackId,cat,policyId]);
  React.useEffect(()=>{const onPop=()=>{apply(AG_SEO.readRoute(location.search));};window.addEventListener('popstate',onPop);return()=>window.removeEventListener('popstate',onPop);});
  // Head + JSON-LD + screen-change focus and announcement
  const first=React.useRef(true);
  React.useEffect(()=>{
    const PT=AG_DATA.pageTitles[lang];const T=AG_DATA.t[lang];const known=ROUTES.includes(route);const view=known?route:'notfound';
    const p=AG_DATA.products.find(x=>x.id===pid);const post=AG_DATA.posts.find(x=>x.id===postId);
    let name=PT[view]||PT.home,desc=PT.desc,image='../../assets/social/og-default-'+lang+'.png';
    if(view==='product'&&p){name=p[lang];desc=(lang==='fa'?p.subFa:p.subEn)+' · '+AG_DATA.money(p.price,lang);image=p.image||image;AG_TRACK.event('view_item',{value:p.price,items:[AG_TRACK.item(p)]});}
    if(view==='shop'&&cat!=='all')name=AG_DATA.catName(cat,lang)||PT.shop;
    if(view==='post'&&post&&post[lang]){name=post[lang].title;desc=post[lang].excerpt;image=post.image||image;}
    if(view==='bag')AG_TRACK.event('view_cart',{});
    if(view==='policy')name=AG_DATA.policies[policyId][lang].title;
    const st=stateToParams(cur);const url=AG_SEO.routeParams({lang,...st});
    AG_SEO.syncHead({title:view==='home'?PT.home:name+PT.suffix,description:desc,image,url,locale:lang,type:view==='product'?'product':view==='post'?'article':'website',
      alternates:{en:AG_SEO.routeParams({lang:'en',...st}),fa:AG_SEO.routeParams({lang:'fa',...st}),'x-default':AG_SEO.routeParams({...st})},noindex:!known||AG_SEO.isNoindex(view)});
    AG_SEO.setJsonLd('product',view==='product'&&p?AG_SEO.productJsonLd(p,{url,lang}):null);
    AG_SEO.setJsonLd('store',view==='home'||view==='contact'?AG_SEO.storeJsonLd({url:AG_SEO.routeParams({lang})}):null);
    const m=document.querySelector('main');if(m&&!m.id)m.id='main';
    if(first.current){first.current=false;return;}
    setAnnounce(name);AG_NAV.focusHeading();
  },[route,pid,postId,cat,policyId,lang]);
  React.useEffect(()=>{const m=document.querySelector('main');if(m&&!m.id)m.id='main';});
  const toggleFav=id=>setFavs(f=>{const on=f.includes(id);if(!on)AG_TRACK.event('add_to_wishlist',{items:[AG_TRACK.item(AG_DATA.products.find(x=>x.id===id))]});(on?AG_API.unsaveItem(id):AG_API.saveItem(id)).catch(e=>console.warn('saved-items sync failed',e));return on?f.filter(x=>x!==id):[...f,id];});
  React.useEffect(()=>{AG_API.loadSaved().then(list=>{if(list)setFavs(f=>[...new Set([...f,...list])]);}).catch(e=>console.warn('wishlist load failed',e));},[tw.apiBase]);
  const addToBag=l=>{setBag(b=>[...b,l]);const p=AG_DATA.products.find(x=>x.id===l.id);AG_TRACK.event('add_to_cart',{value:l.unit*l.qty,items:[AG_TRACK.item(p,l.qty,l.unit)]});setToast(p[lang]);setAnnounce(AG_DATA.t[lang].added+': '+p[lang]);setTimeout(()=>setToast(null),5000);};
  const annKey='vendra-announce-hidden';
  const [annHidden,setAnnHidden]=React.useState(()=>{try{return localStorage.getItem(annKey)==='1';}catch(e){return false;}});
  const props={lang,go,favs,toggleFav,cat,setCat};
  return <>
    <SkipLink href="#main">{lang==='fa'?'رفتن به محتوای اصلی':'Skip to main content'}</SkipLink>
    <LiveRegion>{announce}</LiveRegion>
    {!annHidden&&<window.VendraDesignSystem_f4f210.AnnouncementBar label={lang==='fa'?'اطلاعیه':'Announcement'} closeLabel={lang==='fa'?'بستن':'Dismiss'} onClose={()=>{setAnnHidden(true);try{localStorage.setItem(annKey,'1');}catch(e){}}}>{lang==='fa'?'سفارش تا ساعت ۱۸ برای ارسال همان‌روز در کرج':'Order by 18:00 for same-day delivery in Karaj'}</window.VendraDesignSystem_f4f210.AnnouncementBar>}
    <Header onSearch={()=>setSearching(true)} favCount={favs.length} theme={theme} setTheme={setTheme} lang={lang} setLang={l=>{if(l!==lang)AG_TRACK.event('language_switch',{to:l});setLang(l);}} go={go} route={route} bagCount={bag.reduce((s,l)=>s+l.qty,0)}/>
    {route==='home'&&<Home {...props}/>}{route==='shop'&&<Shop {...props} loadFail={tw.shopResult==='fail'}/>}
    {route==='product'&&<Product {...props} id={pid} addToBag={addToBag}/>}
    {route==='bag'&&<Bag lang={lang} bag={bag} setBag={setBag} go={go} payFail={tw.payResult==='fail'}/>}
    {route==='account'&&<Account lang={lang} setLang={setLang} go={go} signedIn={signedIn} setSignedIn={setSignedIn}/>}
    {route==='track'&&<OrderDetail lang={lang} id={trackId} go={go} signedIn={signedIn} onReorder={o=>{AG_TRACK.event('order_again',{transaction_id:o.id});setBag(b=>[...b,...AG_DATA.reorderLines(o)]);go('bag');}}/>}
    {route==='saved'&&<Saved {...props}/>}
    {route==='weddings'&&<Weddings lang={lang} go={go}/>}
    {route==='journal'&&<Journal lang={lang} go={go}/>}
    {route==='post'&&<Post {...props} id={postId}/>}
    
    {route==='contact'&&<Contact lang={lang} go={go} theme={theme}/>}
    {route==='policy'&&<Policy lang={lang} id={policyId}/>}
    {!ROUTES.includes(route)&&<NotFound lang={lang} go={go} onSearch={()=>setSearching(true)}/>}
    <Footer lang={lang} route={route} go={go}/>
    <SearchOverlay lang={lang} open={searching} onClose={()=>setSearching(false)} go={go}/>
    {mobile&&<MobileNav lang={lang} route={route} go={go} setCat={setCat} bagCount={bag.reduce((s,l)=>s+l.qty,0)}/>}
    <TweaksPanel><TweakSection label="Tenant theme"/><TweakRadio label="Theme" value={tw.tenant} options={[{value:'default',label:'Vendra'},{value:'clay',label:'Clay'}]} onChange={v=>setTweak('tenant',v)}/><TweakSection label="Store settings (admin)"/><TweakSelect label="Currency" value={tw.currency} options={Object.entries(AG_DATA.currencies).map(([k,c])=>({value:k,label:k==='toman'?'Toman (default)':k==='rial'?'Rial':k.toUpperCase()}))} onChange={v=>setTweak('currency',v)}/><TweakSection label="Card-to-card (admin)"/><TweakText label="Card number" value={tw.cardNumber} placeholder="16 digits" onChange={v=>setTweak('cardNumber',v)}/><div style={{fontSize:11,opacity:.75,marginTop:-4}}>{AG_DATA.payment.bank.en}{AG_DATA.payment.cardValid?' · valid':' · check the number'}</div><TweakText label="Card holder (EN)" value={tw.holderEn} onChange={v=>setTweak('holderEn',v)}/><TweakText label="Card holder (FA)" value={tw.holderFa} onChange={v=>setTweak('holderFa',v)}/><TweakText label="Sheba (optional)" value={tw.sheba} placeholder="IR00 0000 …" onChange={v=>setTweak('sheba',v)}/><TweakSection label="Backend"/><TweakText label="API base URL (empty = demo)" value={tw.apiBase} placeholder="https://api.example.com" onChange={v=>setTweak('apiBase',v)}/><TweakSection label="Demo states"/><TweakRadio label="Online payment result" value={tw.payResult} options={[{value:'success',label:'Success'},{value:'fail',label:'Failed'}]} onChange={v=>setTweak('payResult',v)}/><TweakRadio label="Shop loading" value={tw.shopResult||'success'} options={[{value:'success',label:'Loads'},{value:'fail',label:'Fails'}]} onChange={v=>setTweak('shopResult',v)}/><TweakRadio label="Journal loading" value={tw.journalSpeed} options={[{value:'normal',label:'Normal'},{value:'slow',label:'Slow'}]} onChange={v=>setTweak('journalSpeed',v)}/><TweakButton label="Show missing blog post" onClick={()=>go('post','missing-story')}/><TweakButton label="Show 404 page" onClick={()=>go('missing-page')}/><TweakButton label="Show empty bag" onClick={()=>{setBag([]);go('bag');}}/></TweaksPanel>
    {toast&&<div style={{position:'fixed',bottom:mobile?(route==='product'?136:72):24,insetInline:mobile?'12px':'auto 24px',zIndex:120}}><Toast title={AG_DATA.t[lang].added} message={toast} action={{label:lang==='fa'?'مشاهده سبد':'View bag',href:AG_NAV.href('bag'),onClick:e=>{setToast(null);AG_NAV.link(e);}}} onClose={()=>setToast(null)} style={mobile?{width:'100%'}:undefined}/></div>}
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
