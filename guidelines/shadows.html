<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--surface-page);font-family:var(--font-body);color:var(--text-body)}.row{display:flex;gap:12px}.sw{flex:1;min-width:0}.chip{height:64px;border-radius:var(--radius-sm)}.lbl{font-size:12px;margin-top:6px;color:var(--ink-700)}.hex{font-size:11px;color:var(--ink-500);font-variant-numeric:tabular-nums}.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px}.split>div{min-width:0}.lh{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);font-weight:500;padding-bottom:6px;margin-bottom:12px;border-bottom:1px solid var(--border-subtle)}[lang="fa"] .lbl,[lang="fa"] .hex.t{direction:ltr;unicode-bidi:plaintext}[lang="fa"] .lbl{text-align:end}</style></head><body><div class="split"><div lang="en" dir="ltr"><div class="lh">English</div><div class="row" style="gap:28px;padding:10px"><div style="flex:1;height:100px;background:var(--surface-card);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);display:grid;place-items:center" class="hex">--shadow-sm</div><div style="flex:1;height:100px;background:var(--surface-card);border-radius:var(--radius-md);box-shadow:var(--shadow-md);display:grid;place-items:center" class="hex">--shadow-md</div><div style="flex:1;height:100px;background:var(--surface-card);border-radius:var(--radius-md);box-shadow:var(--shadow-lg);display:grid;place-items:center" class="hex">--shadow-lg</div></div></div><div lang="fa" dir="rtl" data-lang="fa"><div class="lh">فارسی</div><div class="row" style="gap:28px;padding:10px"><div style="flex:1;height:100px;background:var(--surface-card);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);display:grid;place-items:center" class="hex" dir="ltr">--shadow-sm</div><div style="flex:1;height:100px;background:var(--surface-card);border-radius:var(--radius-md);box-shadow:var(--shadow-md);display:grid;place-items:center" class="hex" dir="ltr">--shadow-md</div><div style="flex:1;height:100px;background:var(--surface-card);border-radius:var(--radius-md);box-shadow:var(--shadow-lg);display:grid;place-items:center" class="hex" dir="ltr">--shadow-lg</div></div></div></div></body></html>
