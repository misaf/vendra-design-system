<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--surface-page);font-family:var(--font-body);font-size:12px;color:var(--text-muted)}.g{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.t{height:120px;border-radius:8px;display:grid;place-items:center;padding:12px;box-sizing:border-box}.t img{max-width:100%;max-height:100%}.s .t{height:170px}.k{margin:14px 0 8px;font-weight:500;letter-spacing:.14em;text-transform:uppercase}.m{display:flex;gap:20px;align-items:center}.m img{height:40px}.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px}.split>div{min-width:0}.lh{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);font-weight:500;padding-bottom:6px;margin-bottom:12px;border-bottom:1px solid var(--border-subtle)}[lang="fa"] .k{letter-spacing:0}a{color:var(--text-accent)}a:hover{color:var(--accent-hover)}.g{grid-template-columns:repeat(2,minmax(0,1fr))}</style></head><body><div class="split"><div lang="en" dir="ltr"><div class="lh">English</div><div class="k" style="margin-top:0">Horizontal</div><div class="g"><div class="t" style="background:var(--white);border:1px solid var(--border-subtle)"><img src="../assets/logo-horizontal.png" alt="Vendra Florist"></div><div class="t" style="background:var(--ink-900)"><img src="../assets/logo-horizontal-light.png" alt="Vendra Florist"></div></div><div class="k">Stacked</div><div class="g s"><div class="t" style="background:var(--petal-100)"><img src="../assets/logo-stacked.png" alt="Vendra Florist"></div><div class="t" style="background:var(--stem-900)"><img src="../assets/logo-stacked-light.png" alt="Vendra Florist"></div></div><div class="k">Mark</div><div class="m"><img src="../assets/logo-mark.png" alt=""><img src="../assets/logo-mark-ink.png" alt=""><img src="../assets/logo-mark-light.png" alt="" style="background:var(--stem-900);border-radius:8px;padding:4px"><span>Under 40px (favicon, app icon, avatar). -light versions on ink or stem.</span></div></div><div lang="fa" dir="rtl" data-lang="fa"><div class="lh">فارسی</div><div class="k" style="margin-top:0">افقی</div><div class="g"><div class="t" style="background:var(--white);border:1px solid var(--border-subtle)"><img src="../assets/logo-horizontal-fa.png" alt="گل‌فروشی وندرا"></div><div class="t" style="background:var(--stem-900)"><img src="../assets/logo-horizontal-fa-light.png" alt="گل‌فروشی وندرا"></div></div><div class="k">عمودی</div><div class="g s"><div class="t" style="background:var(--petal-100)"><img src="../assets/logo-stacked-fa.png" alt="گل‌فروشی وندرا"></div><div class="t" style="background:var(--ink-900)"><img src="../assets/logo-stacked-fa-light.png" alt="گل‌فروشی وندرا"></div></div><div class="k">نشانه</div><div class="m"><img src="../assets/logo-mark-fa.png" alt=""><img src="../assets/logo-mark-fa-light.png" alt="" style="background:var(--stem-900);border-radius:8px;padding:4px"><span>زیر ۴۰ پیکسل (فاوآیکن، آیکن برنامه، آواتار). نسخهٔ روشن روی زمینهٔ تیره.</span></div></div></div></body></html>
