<!-- @dsCard group="Brand" viewport="700x560" name="Theme builder" subtitle="Pick a tenant's colours, font and shape — live preview, contrast checks, tenant JSON for tokens/tenants/" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<script src="../templates/_shared/tenant-theme.js"></script>
<script src="../templates/_runtime/tenants.js"></script>
<style>body{margin:0;font-family:var(--font-body);color:var(--ink-900);background:var(--white);font-size:13px}a{color:var(--text-accent)}a:hover{color:var(--accent-hover)}.tb{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:560px}.tb-c{padding:12px 16px;border-inline-end:1px solid var(--petal-200);display:flex;flex-direction:column;gap:7px;background:var(--petal-50)}.tb-row{display:flex;align-items:center;justify-content:space-between;gap:8px}.tb-row label{color:var(--ink-700)}.tb-row input[type=color]{width:44px;height:28px;border:1px solid var(--border-input);border-radius:4px;padding:0;background:none;cursor:pointer}.tb-row select{font:inherit;font-size:12px;height:28px;border:1px solid var(--border-input);border-radius:4px;background:var(--white);color:var(--ink-900);max-width:120px}.tb-k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-500);margin-top:2px}.tb-note{font-size:11px;color:var(--ink-500);display:flex;justify-content:space-between;gap:6px}.tb-note button{font:inherit;border:0;background:none;padding:0;color:var(--text-accent);text-decoration:underline;cursor:pointer}.tb-p{padding:18px 20px;display:flex;flex-direction:column;gap:12px;background:var(--surface-page);color:var(--text-body)}.tb-h{font-family:var(--font-display);font-weight:500;font-size:32px;line-height:1.05;letter-spacing:var(--tracking-display);text-transform:var(--display-case);margin:0}.tb-h em{color:var(--text-accent);font-style:var(--accent-font-style);font-weight:var(--accent-font-weight)}.tb-r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tb-g{display:grid;grid-template-columns:104px 1fr;gap:14px}.tb-inv{background:var(--surface-inverse);color:var(--text-on-inverse);padding:10px 12px;border-radius:var(--radius-md);font-size:12px}.tb-ch{display:grid;grid-template-columns:1fr auto auto;gap:3px 10px;font-size:12px;color:var(--text-secondary)}.tb-ok{color:var(--success);font-weight:500}.tb-bad{color:var(--danger);font-weight:500}.tb-ch span:nth-child(3n+2){font-variant-numeric:tabular-nums;color:var(--text-muted)}</style></head><body><div id="root"></div>
<script type="module" src="./theme-builder.card.jsx"></script></body></html>
