<!-- @dsCard group="Colors" viewport="700x2320" name="Contrast (WCAG 2.2 AA)" subtitle="Every text/background token pair — computed live from the tokens" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../tokens/tenants.css"><style>body{margin:0;padding:20px 24px;background:var(--surface-page);color:var(--text-body);font-family:var(--font-body);font-size:13px}h1{font-family:var(--font-display);font-weight:500;font-size:22px;margin:0 0 4px}p{margin:0 0 14px;color:var(--text-secondary);max-width:620px}table{width:100%;border-collapse:collapse}th,td{text-align:start;padding:6px 8px;border-bottom:1px solid var(--border-subtle);vertical-align:middle}th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);font-weight:500}.sw{display:inline-flex;align-items:center;justify-content:center;min-width:64px;height:26px;padding:0 8px;border-radius:6px;border:1px solid var(--border-subtle);font-weight:500}.r{font-variant-numeric:tabular-nums;white-space:nowrap}.pass{color:var(--success)}.fail{color:var(--danger)}code{font-size:12px}.note{margin-top:14px;color:var(--text-secondary)}</style></head><body>
<h1>Contrast</h1><p>Body text needs 4.5:1, large text (24px+, or 19px+ medium) and icons/UI need 3:1. <code>--text-subtle</code> is for decoration and disabled states only. <code>--warning</code> and <code>--info</code> are for icons and borders (3:1); set the text beside them in <code>--text-body</code>.</p>
<table><thead><tr><th>Text / background</th><th>Use</th><th>Ratio</th></tr></thead><tbody id="rows"></tbody></table>
<div id="probeL" data-theme="light" style="position:absolute;visibility:hidden"></div>
<script>
const P=[['--text-body','--surface-page','body',4.5],['--text-body','--surface-card','body',4.5],['--text-body','--surface-muted','body',4.5],['--text-secondary','--surface-page','body',4.5],['--text-secondary','--surface-sunken','body',4.5],['--text-muted','--surface-page','body',4.5],['--text-muted','--surface-card','body',4.5],['--text-muted','--surface-sunken','body',4.5],['--text-muted','--surface-muted','body',4.5],['--text-accent','--surface-page','body',4.5],['--text-accent','--surface-card','body',4.5],['--text-on-accent','--accent','body',4.5],['--text-on-soft','--accent-soft','body',4.5],['--text-on-inverse','--surface-inverse','body',4.5],['--text-inverse-muted','--surface-inverse','body',4.5],['--danger','--surface-card','body',4.5],['--danger','--danger-soft','body',4.5],['--success','--success-soft','body',4.5],['--warning','--warning-soft','icon',3],['--info','--info-soft','icon',3],['--focus-ring','--surface-page','UI',3],['--focus-ring','--surface-card','UI',3],['--focus-ring-on-inverse','--surface-inverse','UI',3],['--border-strong','--surface-card','UI',3],['--border-input','--surface-card','UI',3],['--border-input','--surface-page','UI',3],['--border-input','--surface-sunken','UI',3],['--text-on-accent','--accent-press','body',4.5],['--text-on-strong','--surface-strong','body',4.5],['--text-body','--surface-hover','body',4.5],['--text-info','--info-soft','body',4.5],['--border-input-strong','--surface-card','UI',3],['--control-on','--surface-card','UI',3],['--success-on-inverse','--surface-inverse','icon',3],['--warning-on-inverse','--surface-inverse','icon',3],['--info-on-inverse','--surface-inverse','icon',3],['--text-accent','--surface-page','UI',3],['--text-subtle','--surface-page','decorative',0],['--text-subtle','--surface-card','decorative',0]];
const rgb=(el,v)=>{el.style.color='var('+v+')';const m=getComputedStyle(el).color.match(/[\d.]+/g).map(Number);return m;};
const lum=([r,g,b])=>[r,g,b].map(x=>x/255).map(x=>x<=.03928?x/12.92:((x+.055)/1.055)**2.4).reduce((s,x,i)=>s+x*[.2126,.7152,.0722][i],0);
const cr=(a,b)=>{const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);};
const cell=(el,[t,b,use,min])=>{const r=cr(rgb(el,t),rgb(el,b));const ok=min===0?null:r>=min;return '<td><span class="sw" data-theme="'+el.dataset.theme+'" style="color:var('+t+');background:var('+b+')">Aa</span> <span class="r '+(ok===null?'':ok?'pass':'fail')+'">'+r.toFixed(2)+':1'+(ok===null?' · n/a':ok?' ✓':' ✗')+'</span></td>';};
document.getElementById('rows').innerHTML=P.map(p=>'<tr><td><code>'+p[0]+'</code><br><code style="color:var(--text-muted)">on '+p[1]+'</code></td><td>'+p[2]+(p[3]?' · '+p[3]+':1':'')+'</td>'+cell(probeL,p)+'</tr>').join('');
</script></body></html>
