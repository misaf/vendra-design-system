<style>body{margin:0;padding:20px 24px;font-family:var(--font-body)}a{color:var(--text-accent)}a:hover{color:var(--accent-hover)}.grid{display:grid;grid-template-columns:130px repeat(2,minmax(0,1fr));gap:10px}.h{font-size:11px;color:var(--text-muted);letter-spacing:.06em;text-transform:uppercase;padding:4px 2px}.rl{font-size:13px;font-weight:500;color:var(--text-body);padding-top:16px}.rl small{display:block;font-weight:400;color:var(--text-muted);margin-top:4px;line-height:1.4}.p{position:relative;background:var(--surface-page);color:var(--text-body);padding:14px;border-radius:12px;border:1px solid var(--border-subtle);min-width:0;display:flex;flex-direction:column;gap:10px;overflow:hidden}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}</style></head><body><div id="root"></div>

const T={en:{gal:'Product photos',slide:(i,n)=>`${i} of ${n}`,card:'Delivery to Karaj',cardB:'Same-day if you order by 18:00.',tags:['Roses','Orchids','Under 3M'],pay:'Payment',r1:'Card to card',r1d:'Send the receipt on WhatsApp',r2:'Cash on delivery',r2d:'Central Karaj only',tabs:[['orders','Orders'],['addresses','Addresses'],['reminders','Reminders']],back:'Back',next:'Next',ann:'Free delivery in Karaj on orders over 3,000,000 Toman',annL:'Announcement',dismiss:'Dismiss',tt:'Added to your bag',tm:'Wild Meadow · Generous',view:'View bag',close:'Close',tip:'Save to favourites',save:'Save',dT:'Remove from bag?',dB:'Wild Meadow will be removed.',keep:'Keep',rm:'Remove'},
 fa:{gal:'عکس‌های محصول',slide:(i,n)=>`${fd(i)} از ${fd(n)}`,card:'ارسال به کرج',cardB:'اگر تا ساعت ۱۸ سفارش دهید، همان روز.',tags:['رز','ارکیده','زیر ۳ میلیون'],pay:'پرداخت',r1:'کارت به کارت',r1d:'رسید را در واتساپ بفرستید',r2:'پرداخت در محل',r2d:'فقط کرج مرکزی',tabs:[['orders','سفارش‌ها'],['addresses','نشانی‌ها'],['reminders','یادآورها']],back:'قبلی',next:'بعدی',ann:'ارسال رایگان در کرج برای سفارش‌های بالای ۳٬۰۰۰٬۰۰۰ تومان',annL:'اطلاعیه',dismiss:'بستن',tt:'به سبد اضافه شد',tm:'باغ وحشی · بزرگ',view:'دیدن سبد',close:'بستن',tip:'افزودن به علاقه‌مندی‌ها',save:'ذخیره',dT:'از سبد حذف شود؟',dB:'باغ وحشی از سبد خرید حذف می‌شود.',keep:'نگه دار',rm:'حذف'}};

 ['Gallery','dots + arrows mirror',(t)=>{const {Gallery}=NS;return <div style={{maxWidth:220}}><Gallery images={[{src:PH,alt:''},{src:PH,alt:''},{src:PH,alt:''}]} label={t.gal} slideLabel={t.slide}/></div>;}],

 ['Tooltip','forced open',(t)=>{const {Tooltip,IconButton}=NS;return <div style={{paddingTop:44,display:'flex',justifyContent:'center'}}><Tooltip open content={t.tip}><IconButton icon="heart" label={t.save} variant="outline"/></Tooltip></div>;}],
 ['Dialog','inline preview',(t)=>{const {Button,IconButton}=NS;/* Static copy of Dialog's markup: several live Dialogs on one page would compete for focus. */return <div style={{position:'relative',height:230}}><div className="ag-dialog__overlay ag-dialog__overlay--inline"><div className="ag-dialog" style={{maxWidth:'100%',animation:'none'}}><div className="ag-dialog__head"><h2 className="ag-dialog__title">{t.dT}</h2><IconButton icon="x" label={t.close} size="sm"/></div><div className="ag-dialog__body">{t.dB}</div><div className="ag-dialog__foot"><Button variant="ghost" size="sm">{t.keep}</Button><Button size="sm">{t.rm}</Button></div></div></div></div>;}]];

 {ROWS.map(([name,sub,r])=><React.Fragment key={name}><div className="rl">{name}<small>{sub}</small></div>{COLS.map(([l,th])=><div key={l+th} className="p"  {...(l==='fa'?{dir:'rtl',lang:'fa','data-lang':'fa'}:{dir:'ltr',lang:'en'})}>{r(T[l],l+th)}</div>)}</React.Fragment>)}</div>;}
