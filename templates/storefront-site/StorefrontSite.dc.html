// Sample storefront delivery rules. Amounts are in Toman; cut-offs use local time.
// Edit this file, then run: node templates/_build/generate.cjs
const VF_ZONES = [
  {
    id: 'central', fee: 80_000, cutoff: '18:00',
    en: 'Karaj central', fa: 'مرکز کرج'
  },
  {
    id: 'outer', fee: 120_000, cutoff: '16:00',
    en: 'Karaj outer', fa: 'حومه کرج'
  },
  {
    id: 'alborz', fee: 180_000, cutoff: '14:00',
    en: 'Alborz province', fa: 'استان البرز'
  },
  {
    id: 'tehran', fee: 250_000, cutoff: '12:00',
    en: 'Tehran', fa: 'تهران'
  }
];
const VF_FREE_DELIVERY_THRESHOLD = 5_000_000;
const VF_FREE_DELIVERY_ZONES = ['central', 'outer'];
const VF_SLOTS = [['08', '12'], ['12', '16'], ['16', '20'], ['20', '22']];
const VF_DELIVERY = {name: '', phone: '', address: '', card: '', zone: 'central', slot: '12'};

function vfDeliveryCutoff(zone, persian) {
  const time = persian ? zone.cutoff.replace(/\d/g, digit => '۰۱۲۳۴۵۶۷۸۹'[digit]) : zone.cutoff;
  return persian ? '\u2068' + time + '\u2069' : time;
}

function vfDeliveryHint(zone, persian) {
  return (persian ? 'ارسال همان روز تا ' : 'Same day before ') + vfDeliveryCutoff(zone, persian);
}

function vfPhone(value) {
  return String(value || '')
    .replace(/[۰-۹]/g, digit => '۰۱۲۳۴۵۶۷۸۹'.indexOf(digit))
    .replace(/[٠-٩]/g, digit => '٠١٢٣٤٥٦٧٨٩'.indexOf(digit))
    .replace(/[\s()-]/g, '');
}

function vfErrors(delivery) {
  return {
    name: !String(delivery.name || '').trim(),
    phone: !/^09\d{9}$/.test(vfPhone(delivery.phone)),
    address: String(delivery.address || '').trim().length < 6
  };
}

function vfTotals(lines, delivery) {
  const sub = lines.reduce((sum, line) => sum + line.unit * line.qty, 0);
  const zone = VF_ZONES.find(zone => zone.id === delivery.zone) || VF_ZONES[0];
  const free = sub >= VF_FREE_DELIVERY_THRESHOLD && VF_FREE_DELIVERY_ZONES.includes(zone.id);
  const fee = free ? 0 : zone.fee;
  return {sub, fee, total: sub + fee};
}

function vfReadRoute(search = location.search) {
  window.AG_SEO.register(...VF_ROUTES);
  const route = window.AG_SEO.readRoute(search), query = new URLSearchParams(search);
  if (route.view === 'product' && !VF_PRODUCTS.some(p => p.id === route.id || (p.id === 'ivory' && route.id === 'ivory-classic'))) route.view = 'notfound';
  if (route.view === 'shop') {
    route.cat = ['bouquets','boxes','orchids','bridal'].includes(route.cat) ? route.cat : 'all';
    route.sort = ['low','high'].includes(query.get('sort')) ? query.get('sort') : 'featured';
    route.filters = [...new Set((query.get('filters') || '').split(',').filter(id => ['under3','same','roses'].includes(id)))].sort();
  }
  return route;
}
function vfRouteParams(route) {
  const query = new URLSearchParams(window.AG_SEO.routeParams(route));
  if (route.view === 'shop') {
    if (route.cat === 'all') query.delete('cat');
    if (['low','high'].includes(route.sort)) query.set('sort', route.sort);
    const filters = (route.filters || []).filter(id => ['under3','same','roses'].includes(id));
    if (filters.length) query.set('filters', [...new Set(filters)].sort().join(','));
  }
  return '?' + query.toString();
}

// Shared lifecycle for standalone templates and pages inside the click-through site.
class VFPage extends DCLogic {
  componentDidMount() {
    this._vfMedia = window.matchMedia('(max-width:767px)');
    this._vfResize = () => this.setState({
      vfMobile: this._vfMedia.matches
    });
    this._vfMedia.addEventListener('change', this._vfResize);
    this._vfResize();
    this._vfAnnounce();
  }
  componentDidUpdate() {
    this._vfAnnounce();
  }
  componentWillUnmount() {
    this._vfMedia && this._vfMedia.removeEventListener('change', this._vfResize);
    clearTimeout(this._vfTimer);
  }
  _vfAnnounce() {
    clearTimeout(this._vfTimer);
    this._vfTimer = setTimeout(() => {
      const h = document.querySelector('main h1');
      if (!h) return;
      const title = h.innerText.replace(/\s+/g, ' ').trim();
      if (title === this._vfTitle) return;
      this._vfTitle = title;
      window.AG_NAV.focusHeading();
      if (this.props.store && this.props.store.announce) this.props.store.announce(title);else this.setState({
        vfAnnouncement: title
      });
      const lang = this.props.lang === 'fa' ? 'fa' : 'en';
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
      document.documentElement.dataset.lang = lang;
      const url = location.href;
      window.AG_SEO.syncHead({
        title: title + ' · ' + VF_SHELL[lang].brand,
        description: title,
        url,
        locale: lang,
        noindex: window.AG_SEO.isNoindex(this._vfPage) || this._vfPage === 'signin',
        alternates: Object.fromEntries(['en','fa'].map(lang => [lang,
          (this.props.go ? '' : '../storefront-site/StorefrontSite.dc.html') + vfRouteParams({...VF_ROUTE_EXTRA[this._vfPage], ...vfPageRoute(this.props),view:this._vfPage,lang})]))
      });
    }, 40);
  }
}

const VF_BAG0=vfSampleBag();
const VF_SESSION='vendra-template:'+location.pathname;
function vfSiteInitial(props){
 let saved={};try{saved=JSON.parse(sessionStorage.getItem(VF_SESSION)||'{}')||{};}catch(e){}
 const route=vfReadRoute();return {route:route.view==='home'&&!new URLSearchParams(location.search).has('view')?(props.start||'home'):route.view,
 routeInfo:route,lang:route.lang||props.lang||'en',tenant:null,mobile:null,bag:Array.isArray(saved.bag)?saved.bag:VF_BAG0,

}
class Component extends DCLogic {
 state=vfSiteInitial(this.props);
 componentDidMount(){
  window.__vfSite=this;
  this._pop=()=>{const r=vfReadRoute();if(r.view==='checkout'&&!this.state.order&&(!this.state.bag.length||Object.values(vfErrors(this.state.delivery)).some(Boolean))){this.navigate({view:'bag',lang:r.lang},true);return;}this.setState({route:r.view,routeInfo:r,lang:r.lang||this.props.lang||'en'});};window.addEventListener('popstate',this._pop);

 }
 componentDidUpdate(){try{const {bag,saved,delivery,order,lastOrder}=this.state;sessionStorage.setItem(VF_SESSION,JSON.stringify({bag,saved,delivery,order,lastOrder}));}catch(e){}}
 componentWillUnmount(){window.removeEventListener('popstate',this._pop);if(window.__vfSite===this)delete window.__vfSite;}
 navigate(input,replace=false){
  const candidate=typeof input==='string'?{lang:this.state.lang,view:input,...VF_ROUTE_EXTRA[input]}:{lang:this.state.lang,...input};
  let r=vfReadRoute(vfRouteParams(candidate));
  if(r.view==='checkout'&&!this.state.order&&(!this.state.bag.length||Object.values(vfErrors(this.state.delivery)).some(Boolean)))r={lang:r.lang,view:'bag'};
  const url=vfRouteParams(r);if(url!==location.search)history[replace?'replaceState':'pushState']({},'',url);

 }

    reset:()=>this.setState({order:null,bag:VF_BAG0}),clear:()=>this.setState({bag:[]}),
    toggleSave:id=>this.setState(p=>({saved:p.saved.includes(id)?p.saved.filter(x=>x!==id):[...p.saved,id]})),setSaved:ids=>this.setState({saved:ids})},
   mobile:s.mobile!=null?s.mobile:!!this.props.mobile,go:r=>this.navigate(r)};
