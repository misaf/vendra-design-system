// Shared lifecycle for standalone templates and pages inside the click-through site.
class VFPage extends DCLogic {
 componentDidMount(){
  this._vfMedia=window.matchMedia('(max-width:767px)');this._vfResize=()=>this.setState({vfMobile:this._vfMedia.matches});
  this._vfMedia.addEventListener('change',this._vfResize);this._vfResize();this._vfAnnounce();
 }
 componentDidUpdate(){this._vfAnnounce();}
 componentWillUnmount(){this._vfMedia&&this._vfMedia.removeEventListener('change',this._vfResize);clearTimeout(this._vfTimer);}
 _vfAnnounce(){clearTimeout(this._vfTimer);this._vfTimer=setTimeout(()=>{
  const h=document.querySelector('main h1');if(!h)return;const title=h.innerText.replace(/\s+/g,' ').trim();
  if(title===this._vfTitle)return;this._vfTitle=title;window.AG_NAV.focusHeading();
  if(this.props.store&&this.props.store.announce)this.props.store.announce(title);else this.setState({vfAnnouncement:title});
  const lang=this.props.lang==='fa'?'fa':'en';document.documentElement.lang=lang;document.documentElement.dir=lang==='fa'?'rtl':'ltr';document.documentElement.dataset.lang=lang;
  const url=location.href;window.AG_SEO.syncHead({title:title+' · '+VF_SHELL[lang].brand,description:title,url,locale:lang,noindex:window.AG_SEO.isNoindex(this._vfPage)||this._vfPage==='signin',alternates:{en:(this.props.go?'':'../storefront-site/StorefrontSite.dc.html')+window.AG_SEO.hrefFor({lang:'en'},this._vfPage,VF_ROUTE_EXTRA[this._vfPage]),fa:(this.props.go?'':'../storefront-site/StorefrontSite.dc.html')+window.AG_SEO.hrefFor({lang:'fa'},this._vfPage,VF_ROUTE_EXTRA[this._vfPage])}});
 },40);}
}

 });
 const close=()=>self.setState({vfMenu:false});

 const menuItems=['home','shop','weddings','journal','saved','contact','account','track'].map(r=>({label:T[r],current:cur[r],href:href[r],go:props.go?window.AG_SEO.linkHandler(route=>{close();props.go(route);}):undefined}));
 const count=store?store.count:2,favList=store?store.saved:st.vfFavs;
 return {go,href,lang:L,fa,dir:fa?'rtl':'ltr',tenant:props.tenant??'default',mob,desk:!mob,previewMobile:!!props.mobile,frameW:mob?'390px':'none',
 nav:{shop:cur.shop,weddings:cur.weddings,journal:cur.journal},bagCount:count?(fa?VF_FA_DIGITS(count):count):undefined,
 skipGo:e=>{e.preventDefault();window.AG_NAV.focusHeading();},standalone:!props.store,vfAnnouncement:st.vfAnnouncement||'',menuOpen:!!st.vfMenu,openMenu:()=>self.setState({vfMenu:true}),closeMenu:close,menuItems,

 isFav:(id,def)=>(favList||def).includes(id),toggleFav:(id,def)=>()=>{if(store){store.toggleSave(id);return;}const c=st.vfFavs||def;self.setState({vfFavs:c.includes(id)?c.filter(x=>x!==id):[...c,id]});},

}
const VF_BAG0=[
 {id:'ivory-classic',unit:4900000,qty:1,en:['Ivory ribbon box','Classic · 20 stems','“Happy birthday, Shirin.”'],fa:['باکس روبان عاجی','کلاسیک · ۲۰ شاخه','«تولدت مبارک، شیرین.»']},

const VF_SESSION='vendra-template:'+location.pathname;
function vfReadRoute(){window.AG_SEO.register(...VF_ROUTES);return window.AG_SEO.readRoute();}
function vfSiteInitial(props){
 let saved={};try{saved=JSON.parse(sessionStorage.getItem(VF_SESSION)||'{}')||{};}catch(e){}
 const route=vfReadRoute();return {route:route.view==='home'&&!new URLSearchParams(location.search).has('view')?(props.start||'home'):route.view,
 routeInfo:route,lang:route.lang||props.lang||'en',tenant:null,mobile:null,bag:Array.isArray(saved.bag)?saved.bag:VF_BAG0,
 saved:Array.isArray(saved.saved)?saved.saved:['orchid','crimson','blush'],delivery:{...VF_DELIVERY,...saved.delivery},order:saved.order||null,announcement:''};
}
class Component extends DCLogic {
 state=vfSiteInitial(this.props);
 componentDidMount(){
  window.__vfSite=this;
  this._pop=()=>{const r=vfReadRoute();if(r.view==='checkout'&&!this.state.order&&(!this.state.bag.length||Object.values(vfErrors(this.state.delivery)).some(Boolean))){this.navigate({view:'bag',lang:r.lang},true);return;}this.setState({route:r.view,routeInfo:r,lang:r.lang||this.props.lang||'en'});};window.addEventListener('popstate',this._pop);

 }
 componentDidUpdate(){try{const {bag,saved,delivery,order}=this.state;sessionStorage.setItem(VF_SESSION,JSON.stringify({bag,saved,delivery,order}));}catch(e){}}

  let r=window.AG_SEO.readRoute(window.AG_SEO.routeParams(candidate));

  const url=window.AG_SEO.routeParams(r);if(url!==location.search)history[replace?'replaceState':'pushState']({},'',url);

    setQty:(id,q)=>this.setState(p=>({order:null,bag:p.bag.map(x=>x.id===id?{...x,qty:q}:x)})),remove:id=>this.setState(p=>({order:null,bag:p.bag.filter(x=>x.id!==id)})),

 }
}
