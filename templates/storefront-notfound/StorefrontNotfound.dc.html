// Shared lifecycle for standalone templates and pages inside the click-through site.
class VFPage extends DCLogic {
 componentDidMount(){

 }
 componentDidUpdate(){this._vfAnnounce();}

 _vfAnnounce(){clearTimeout(this._vfTimer);this._vfTimer=setTimeout(()=>{

 },40);}

function vfShell(props,page){

 hasLang:!!props.setLang,setLang:props.setLang,langOpts:[{id:'en',label:'EN'},{id:'fa',label:'فا'}],waHref:'https://wa.me/989129333034',
 isFav:(id,def)=>(favList||def).includes(id),toggleFav:(id,def)=>()=>{if(store){store.toggleSave(id);return;}const c=st.vfFavs||def;self.setState({vfFavs:c.includes(id)?c.filter(x=>x!==id):[...c,id]});},

 n:v=>fa?VF_FA_DIGITS(v):String(v),m:v=>VF_MONEY(v,fa),t:T};
}
