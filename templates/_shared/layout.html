<helmet>
<script src="./ds-base.js">
</script>
<style>body{margin:0}a{color:var(--text-accent)}a:hover{color:var(--accent-hover)}[data-vf-preview="true"]{max-width:390px;contain:layout}.vf-page,.vf-page *{box-sizing:border-box}.vf-page main{width:100%;min-width:0}.vf-page main>*{min-width:0}@media(max-width:767px){.vf-page main{padding-inline:16px!important}.vf-page aside{width:100%;min-width:0}}
/* INFORMATION_PAGE_STYLES */
</style>
</helmet>
<div style="background:var(--surface-muted);min-height:100vh">
<div class="vf-page" data-vf-preview="{{ previewMobile }}" data-tenant="{{ tenant }}" lang="{{ lang }}" dir="{{ dir }}" data-lang="{{ lang }}" data-vf-mobile="{{ mob }}" style="margin:0 auto;container-type:inline-size;background:var(--surface-page);color:var(--text-body);font-family:var(--font-body);min-height:100vh;display:flex;flex-direction:column">
<x-import component-from-global-scope="VendraDesignSystem_f4f210.SkipLink" href="#main" on-click="{{ skipGo }}" hint-size="0px,0px">{{ t.skip }}</x-import>
<sc-if value="{{ standalone }}" hint-placeholder-val="{{ true }}">
<x-import component-from-global-scope="VendraDesignSystem_f4f210.LiveRegion" hint-size="0px,0px">{{ vfAnnouncement }}</x-import>
</sc-if>
<sc-if value="{{ desk }}" hint-placeholder-val="{{ true }}">
<!-- DESKTOP_HEADER -->
</sc-if>
<sc-if value="{{ mob }}" hint-placeholder-val="{{ false }}">
<!-- MOBILE_HEADER -->
</sc-if>
<!-- MOBILE_MENU -->
<div style="flex:1">
<!-- PAGE_CONTENT -->
</div>
<!-- FOOTER -->
<sc-if value="{{ mob }}" hint-placeholder-val="{{ false }}">
<div style="position:sticky;bottom:0;z-index:60">
<!-- STICKY_CONTENT -->
<x-import component-from-global-scope="VendraDesignSystem_f4f210.BottomTabBar" items="{{ tabs }}" label="{{ t.mainNav }}" hint-size="100%,64px">
</x-import>
</div>
</sc-if>
</div>
</div>
