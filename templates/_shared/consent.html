<section id="vf-consent" tabindex="-1" aria-labelledby="vf-consent-title" class="vf-shell-consent ag-on-inverse tw:flex tw:flex-col tw:gap-2 tw:p-4 tw:rounded-md tw:bg-inverse tw:text-on-inverse tw:shadow-lg tw:text-sm tw:leading-body">
<div class="tw:flex tw:items-center tw:justify-between tw:gap-3"><h2 id="vf-consent-title" class="tw:m-0 tw:font-display tw:font-medium tw:text-md tw:tracking-display">{{ t.consent.title }}</h2><x-import component-from-global-scope="VendraDesignSystem_f4f210.IconButton" icon="x" label="{{ t.consent.close }}" on-click="{{ consent.close }}" class-name="ag-iconbtn--inverse vf-shell-consent-close tw:-me-2" hint-size="44px,44px"></x-import></div>
<p class="tw:m-0">{{ t.consent.body }} <a href="{{ consent.policy.href }}" onClick="{{ consent.policy.go }}" class="vf-shell-consent-link tw:text-on-inverse! tw:[text-underline-offset:4px]">{{ t.consent.policy }}</a></p>
<div class="tw:flex tw:flex-wrap tw:gap-2">
<button type="button" onClick="{{ consent.accept }}" class="vf-shell-consent-accept tw:flex-1 tw:whitespace-nowrap tw:min-h-tap tw:px-4 tw:rounded-full tw:[border:1px_solid_var(--text-on-inverse)] tw:[font:inherit] tw:font-medium tw:cursor-pointer tw:bg-on-inverse tw:text-body tw:hover:bg-sunken">{{ t.consent.accept }}</button>
<button type="button" onClick="{{ consent.essential }}" class="vf-shell-consent-essential tw:flex-1 tw:whitespace-nowrap tw:min-h-tap tw:px-4 tw:rounded-full tw:[border:1px_solid_var(--text-on-inverse)] tw:[font:inherit] tw:font-medium tw:cursor-pointer tw:bg-transparent tw:text-on-inverse tw:hover:bg-[color-mix(in_srgb,var(--text-on-inverse)_12%,transparent)]">{{ t.consent.essential }}</button>
</div>
</section>
