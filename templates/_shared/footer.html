<footer class="vf-shell-footer">
<div class="vf-shell-footer-content tw:mx-auto tw:grid">
<div class="vf-shell-footer-brand">{{ t.brand }}</div>
<div class="vf-shell-footer-details tw:flex tw:flex-col tw:gap-2">
<div class="vf-shell-footer-label">{{ t.visit }}</div>
<div>{{ t.address }}</div>
<div>{{ t.hours }}</div>
</div>
<div class="vf-shell-footer-details tw:flex tw:flex-col tw:gap-2">
<div class="vf-shell-footer-label">{{ t.contact }}</div>
<a href="{{ phoneHref }}" dir="ltr" class="vf-shell-footer-contact-link">{{ phoneLabel }}</a>
<a href="{{ instagram.url }}" target="_blank" rel="noopener noreferrer" dir="ltr" class="vf-shell-footer-contact-link">{{ instagram.label }}</a>
</div>
<nav aria-label="{{ t.faq }}" class="vf-shell-footer-nav tw:flex tw:flex-col tw:gap-2">
<a href="{{ href.faq }}" onClick="{{ go.faq }}" class="vf-shell-footer-link">{{ t.faq }}</a>
</nav>
</div>
</footer>
