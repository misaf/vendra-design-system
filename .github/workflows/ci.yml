# Pushes to master and pull requests: formatting and generated files, unit tests, then the browser
# tests. The browser tests run inside Playwright's Linux image, pinned to the version in
# templates/package.json, so the -linux screenshot baselines stay comparable from run to run.
# After a deliberate visual change, run the "Update screenshots" workflow to refresh them.
name: CI

# Branches run through their pull request; pushes run on master only, so a branch with a pull
# request isn't tested twice.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # The runner job reads which files a pull request changes.
  pull-requests: read

jobs:
  check:
    name: Check and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Formatting, and dist/, Tailwind, tenant CSS and the tenant list match their sources.
      - run: npm --prefix templates run check
      # Types, storefront logic, tenants, the package's server render, its bundle size and the API
      # contract.
      - run: npm --prefix templates test

  react-19:
    name: Package on React 19
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The workspace tests on React 18.3.1; this installs React 19 in a scratch app and runs the
      # package test (import, server render, wording, themes) and a strict type check there.
      - run: npm --prefix templates run test:react19

  # Skips the browser tests when a push or pull request changes only .github/ (Dependabot's action
  # bumps, workflow edits): run CI by hand after a workflow change that the browser tests need to
  # prove. Manual runs always test.
  # Picks the machine for the browser tests. With the repository variable E2E_RUNS_ON set (a JSON
  # label list such as ["self-hosted","vendra-e2e"]), pushes, manual runs and pull requests from
  # this repository's own branches run on that self-hosted runner, with E2E_WORKERS workers. Pull
  # requests from forks always stay on GitHub's runners, so outside code never reaches the server.
  # There the container is capped at E2E_CPUS cores (when set) and 5 GB, so the server's own
  # services keep the rest.
  runner:
    name: Pick the browser-test runner
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      e2e: ${{ steps.changes.outputs.e2e }}
      labels: ${{ steps.pick.outputs.labels }}
      workers: ${{ steps.pick.outputs.workers }}
      options: ${{ steps.pick.outputs.options }}
    steps:
      - id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename') || files=''
          elif [ "$EVENT" = push ] && [ -n "${BEFORE//0/}" ]; then
            files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$AFTER" --jq '.files[].filename') || files=''
          else
            files=''
          fi
          if [ -n "$files" ] && [ -z "$(printf '%s\n' "$files" | grep -v '^\.github/')" ]; then
            echo 'Only .github/ changed: skipping the browser tests.'
            echo 'e2e=false' >> "$GITHUB_OUTPUT"
          else
            echo 'e2e=true' >> "$GITHUB_OUTPUT"
          fi
      - id: pick
        env:
          RUNS_ON: ${{ vars.E2E_RUNS_ON }}
          WORKERS: ${{ vars.E2E_WORKERS }}
          CPUS: ${{ vars.E2E_CPUS }}
          TRUSTED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [ -n "$RUNS_ON" ] && [ "$TRUSTED" = true ]; then
            limits=' --memory=5g --memory-swap=5g'
            if [ -n "$CPUS" ]; then limits="$limits --cpus=$CPUS"; fi
            {
              echo "labels=$RUNS_ON"
              echo "workers=$WORKERS"
              echo "options=--ipc=host$limits"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo 'labels="ubuntu-24.04"'
              echo 'workers='
              echo 'options=--ipc=host'
            } >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: Browser tests (cards, pages, axe)
    needs: [check, runner]
    if: needs.runner.outputs.e2e == 'true'
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    timeout-minutes: 75
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: ${{ needs.runner.outputs.options }}
    env:
      CI: 'true'
      HOME: /root
      E2E_WORKERS: ${{ needs.runner.outputs.workers }}
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm --prefix templates run test:e2e
      - name: Keep the report and failing screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            templates/_e2e/playwright-report
            templates/_e2e/test-results
          retention-days: 14
      # The container runs as root; hand the checkout back to the runner's user so a self-hosted
      # runner can clean it before the next job.
      - name: Return the workspace to the runner user
        if: always()
        run: chown -R "$(stat -c %u:%g "$RUNNER_TEMP")" "$GITHUB_WORKSPACE"

  e2e-build:
    name: Production build and performance budgets
    needs: [check, runner]
    if: needs.runner.outputs.e2e == 'true'
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    timeout-minutes: 75
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: ${{ needs.runner.outputs.options }}
    env:
      CI: 'true'
      HOME: /root
      E2E_WORKERS: ${{ needs.runner.outputs.workers }}
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm --prefix templates run test:e2e:build
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-build-report
          path: |
            templates/_e2e/playwright-report
            templates/_e2e/test-results
          retention-days: 14
      # The container runs as root; hand the checkout back to the runner's user so a self-hosted
      # runner can clean it before the next job.
      - name: Return the workspace to the runner user
        if: always()
        run: chown -R "$(stat -c %u:%g "$RUNNER_TEMP")" "$GITHUB_WORKSPACE"
