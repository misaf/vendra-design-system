# Pushes to master and pull requests: formatting and generated files, unit tests, then the browser
# tests. The browser tests run inside Playwright's Linux image, pinned to the version in
# package.json, so the -linux screenshot baselines stay comparable from run to run.
# After a deliberate visual change, run the "Update screenshots" workflow to refresh them.
name: CI

# Branches run through their pull request; pushes run on master only, so a branch with a pull
# request isn't tested twice.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # The changes job reads which files a pull request changes.
  pull-requests: read

jobs:
  check:
    name: Check and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Formatting, linting, and generated output.
      - run: npm run check
      # Types, storefront logic, tenants, the package's server render, its bundle size and the API
      # contract.
      - run: npm test

  # Skips the browser tests when a push or pull request changes only .github/ (Dependabot's action
  # bumps, workflow edits): run CI by hand after a workflow change that the browser tests need to
  # prove. Manual runs always test.
  changes:
    name: Check which files changed
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      e2e: ${{ steps.changes.outputs.e2e }}
    steps:
      - id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename') || files=''
          elif [ "$EVENT" = push ] && [ -n "${BEFORE//0/}" ]; then
            files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$AFTER" --jq '.files[].filename') || files=''
          else
            files=''
          fi
          if [ -n "$files" ] && [ -z "$(printf '%s\n' "$files" | grep -v '^\.github/')" ]; then
            echo 'Only .github/ changed: skipping the browser tests.'
            echo 'e2e=false' >> "$GITHUB_OUTPUT"
          else
            echo 'e2e=true' >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: Development fixtures and components
    needs: [check, changes]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    env:
      CI: 'true'
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      # The image ships its own Node; use the 22 the other jobs and local runs use. (Under the
      # image's Node, the dev server aborted in V8 while sending the 8 MB react-aria-components
      # pre-bundle, failing every later test.)
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:e2e:dev
      - name: Keep the report and failing screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14

  e2e-build:
    name: Production storefront, visuals and performance
    needs: [check, changes]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    env:
      CI: 'true'
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      # The image ships its own Node; use the 22 the other jobs and local runs use. (Under the
      # image's Node, the dev server aborted in V8 while sending the 8 MB react-aria-components
      # pre-bundle, failing every later test.)
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Build and smoke-test the live Next.js storefront
        run: |
          npm run build
          npm run test:smoke:app
      - run: npm run test:e2e:demo
      - name: Test the Next.js export under the Pages base path
        env:
          VF_BASE_PATH: /${{ github.event.repository.name }}
          VF_ORIGIN: https://${{ github.repository_owner }}.github.io
        run: |
          npm run build:demo
          npm run test:smoke:demo
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-build-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14

  pages-build:
    name: Build the Pages demo
    needs: [check, e2e, e2e-build]
    # All three suites must succeed. A .github/-only push skips the browser tests and deployment;
    # run CI manually on master to test and deploy those changes.
    if: >-
      success() && github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # Prerendered pages name their absolute address (canonical, og:url, og:image).
      - run: npm run build:demo
        env:
          VF_BASE_PATH: /${{ github.event.repository.name }}
          VF_ORIGIN: https://${{ github.repository_owner }}.github.io
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .generated/export

  pages-deploy:
    name: Deploy the Pages demo
    needs: pages-build
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
