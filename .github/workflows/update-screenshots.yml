# Run by hand after a deliberate visual change: it renders every card and page in the same
# Linux image as CI and commits the changed -linux screenshots to a non-default branch. Look
# at the committed images before merging, as with the local -darwin ones. It runs on the
# self-hosted runner when the repository variable E2E_RUNS_ON names one (see ci.yml); only people
# with write access can start it.
name: Update screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-branch:
    name: Require a review branch
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Reject the default branch and tags
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$REF_TYPE" != branch ] || [ "$REF_NAME" = "$DEFAULT_BRANCH" ]; then
            echo '::error::Run Update screenshots on a non-default branch, then review the changed images in a pull request. The default branch and tags are not allowed.'
            exit 1
          fi

  update:
    needs: validate-branch
    permissions:
      contents: write
    runs-on: ${{ vars.E2E_RUNS_ON && fromJSON(vars.E2E_RUNS_ON) || 'ubuntu-24.04' }}
    timeout-minutes: 75
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: ${{ vars.E2E_RUNS_ON && format('--ipc=host --memory=5g --memory-swap=5g{0}', vars.E2E_CPUS && format(' --cpus={0}', vars.E2E_CPUS) || '') || '--ipc=host' }}
    env:
      CI: 'true'
      HOME: /root
      E2E_WORKERS: ${{ vars.E2E_RUNS_ON && vars.E2E_WORKERS || '' }}
    steps:
      - uses: actions/checkout@v7
      # The image ships its own Node; use the 22 the other jobs and local runs use. (Under the
      # image's Node, the dev server aborted in V8 while sending the 8 MB react-aria-components
      # pre-bundle, failing every later test.)
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      # Rewrites the screenshots that differ or are missing; the other tests still have to pass.
      - run: npm --prefix apps/storefront run test:e2e:update
      - name: Commit the new screenshots
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'apps/storefront/e2e/__screenshots__/*-linux.png'
          if git diff --cached --quiet; then
            echo 'The Linux screenshots are already current.'
          else
            git commit -m 'Update the Linux screenshots'
            git push
          fi
      # The container runs as root; hand the checkout back to the runner's user so a self-hosted
      # runner can clean it before the next job.
      - name: Return the workspace to the runner user
        if: always()
        run: chown -R "$(stat -c %u:%g "$RUNNER_TEMP")" "$GITHUB_WORKSPACE"
