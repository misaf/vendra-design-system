# Run by hand after a deliberate visual change: it renders every card and page in the same
# Linux image as CI and commits the changed -linux screenshots to the branch it ran on. Look
# at the committed images before merging, as with the local -darwin ones.
name: Update screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      CI: 'true'
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      # Rewrites the screenshots that differ or are missing; the other tests still have to pass.
      - run: npm --prefix templates run test:e2e:update
      - name: Commit the new screenshots
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'templates/_e2e/__screenshots__/*-linux.png'
          if git diff --cached --quiet; then
            echo 'The Linux screenshots are already current.'
          else
            git commit -m 'Update the Linux screenshots'
            git push
          fi
