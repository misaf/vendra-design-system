# Weekly pull requests for the pinned tools, each tested by CI like any change. A release waits two
# weeks before it is offered (cooldown), so a broken or hijacked version is usually pulled first.
# - React's majors are left for a deliberate upgrade: the package supports React 19 only (its peer
#   range starts at the version the workspace pins and tests).
# - @playwright/test must match the Playwright image in .github/workflows/*.yml (assets.test.mjs
#   fails otherwise): on its pull request, bump the image tag too, then run "Update screenshots".
# - packages/design-system and apps/storefront both pin React and React Aria. This one root entry
#   updates every workspace manifest in the same pull request; tests/dependencies.test.mjs fails if
#   their versions differ or the lockfile installs a second copy.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: '@types/react'
        update-types: [version-update:semver-major]
    groups:
      react-aria:
        patterns: ['react-aria-components', '@internationalized/*']
      playwright:
        patterns: ['@playwright/test', '@axe-core/playwright']
      build-tools:
        patterns:
          [
            'rolldown',
            'tailwindcss',
            '@tailwindcss/*',
            'typescript',
            'prettier',
            'stylelint'
          ]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']
