<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The build writes each page's own <head> tags and language here (_build/vite.config.mjs); the
     app keeps them current as pages change (_shared/page-lifecycle.js). -->
<title>Vendra Florist</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The body fonts every page uses (Latin and Persian), fetched with the HTML instead of after the CSS.
     URLs start at the site root (the build adds its base), because every route serves this page. -->
<link rel="preload" href="/assets/fonts/jost-var-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/vazirmatn-var-arabic.woff2" as="font" type="font/woff2" crossorigin>
<style>body{margin:0}</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/apps/storefront/app/main.jsx"></script>
</body>
</html>
