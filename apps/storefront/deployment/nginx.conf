# Reference nginx server for the built storefront: `npm --prefix apps/storefront run build:app` writes
# apps/storefront/_app-build/, built for the site root (`--base /`). Copy the folder to the server and point
# `root` at it. Other hosts (a CDN, Netlify, Cloudflare Pages, S3) should apply the same rules:
# precompressed files, and the four caching classes below.
#
# The security headers (Content-Security-Policy and friends) belong in this same file: add them to each
# `location` below, because nginx drops server-level add_header lines in a location that has its own.

server {
    listen 80;
    server_name shop.example;
    root /srv/vendra/_app-build;

    # The build writes a .br and a .gz copy beside every script, stylesheet, page and data file
    # (build/compress.mjs); serve those as they are. brotli_static needs the ngx_brotli module;
    # without it, delete that line and gzip_static still applies.
    brotli_static on;
    gzip_static on;
    gzip_vary on;
    # Anything without a precompressed copy (a small file, an API response proxied here).
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    # 1. Content-hashed build output (assets/hashed/<name>-<hash>.<ext>, build.assetsDir in
    #    build/vite.config.mjs): a new build gives a changed file a new name, so browsers keep these
    #    for a year without asking. Fonts are fetched in CORS mode (`crossorigin` preloads,
    #    @font-face), so these also allow any origin.
    location ^~ /assets/hashed/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # 2. Fonts kept under their own names (the package's assets/fonts/): long-term caching plus CORS,
    #    not immutable.
    location ^~ /packages/design-system/assets/fonts/ {
        add_header Cache-Control "public, max-age=2592000";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # 3. Other files under fixed names: product photos, icons, the Leaflet map files. They change
    #    rarely, but a deploy may replace one, so caches check back after a day.
    location ~ ^/(assets|apps/storefront/_vendor)/ {
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        try_files $uri =404;
    }

    # Retired journal articles answer with a permanent redirect to the posts that replaced them;
    # keep these the same as VF_POST_MOVED (shared/translations/journal-moved.js).
    rewrite ^/apps/storefront/app/(en|fa)/journal/care/?$ /apps/storefront/app/$1/journal/bouquet-last-longer/ permanent;
    rewrite ^/apps/storefront/app/(en|fa)/journal/bridal/?$ /apps/storefront/app/$1/journal/bridal-bouquet-guide/ permanent;
    rewrite ^/apps/storefront/app/(en|fa)/journal/orchids/?$ /apps/storefront/app/$1/journal/orchid-care/ permanent;

    # 4. Pages, the service worker, tenant themes and the offline manifest: always revalidated, so a
    #    deploy reaches every visitor on their next load (ETags keep unchanged ones to a 304).
    location = /apps/storefront/app/sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location ^~ /packages/design-system/tokens/tenants/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location /apps/storefront/app/ {
        add_header Cache-Control "no-cache";
        # Every public address has its own prerendered page (en/shop/boxes/index.html); any other
        # address under the app (an order to track, a mistyped link) gets the not-found page, which
        # the app then reads the address from.
        try_files $uri $uri/index.html =404;
        error_page 404 /404.html;
    }
    location = /404.html {
        # `always`: add_header otherwise skips 404 responses, and this page is served as one.
        add_header Cache-Control "no-cache" always;
        internal;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
    }
}
